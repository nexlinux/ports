name: bleachbit
version: 5.0.2
source:
  url: https://download.bleachbit.org/bleachbit-5.0.2.tar.bz2
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - gettext
  - openpgp-keys-bleachbit
  - chardet
  - psutil
  - pygobject
  - gtk+
  runtime:
  - chardet
  - psutil
  - pygobject
  - gtk+
