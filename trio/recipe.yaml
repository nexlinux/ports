name: trio
version: 0.34.0
source:
  url: https://github.com/python-trio/trio/archive/v0.34.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - astor
  - immutables
  - pyopenssl
  - trustme
  - attrs
  - idna
  - outcome
  - sniffio
  - sortedcontainers
  runtime:
  - attrs
  - idna
  - outcome
  - sniffio
  - sortedcontainers
