name: sphinxcontrib-plantuml
version: '0.31'
source:
  url: https://github.com/sphinx-contrib/plantuml/archive/refs/tags/0.31.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - texlive
  - sphinxcontrib-applehelp
  - latexmk
  - texlive-fontutils
  - texlive-latexextra
