name: sphinxcontrib-doxylink
version: 1.13.0
source:
  url: https://github.com/sphinx-contrib/doxylink/archive/refs/tags/1.13.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - doxygen
  - testfixtures
  - sphinx
  - pyparsing
  - python-dateutil
  runtime:
  - sphinx
  - pyparsing
  - python-dateutil
