name: statsmodels
version: 0.14.6
source:
  url: https://github.com/statsmodels/statsmodels/archive/refs/tags/v0.14.6.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - cython
  - setuptools-scm
  - numpy
  - scipy
  runtime:
  - numpy
  - packaging
  - pandas
  - patsy
  - scipy
