name: turbovnc
version: 3.3.1
source:
  url: https://github.com/TurboVNC/turbovnc/releases/download/3.3.1/turbovnc-3.3.1.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - openpgp-keys-vgl-turbovnc
  - xauth
  - libX11
  - libXext
  - xkeyboard-config
  - libjpeg-turbo
  - pam
  - opengl
  - libXau
  - libXdmcp
  - libXfont2
  - pixman
  - mesa
  - libxshmfence
  - openssl
  - tigervnc
  - libXi
  runtime:
  - xkbcomp
  - jre
