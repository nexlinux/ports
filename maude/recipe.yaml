name: maude
version: 3.2.2
source:
  url: https://github.com/maude-lang/Maude/archive/refs/tags/3.2.2.tar.gz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - unzip
  - yacc
  - lex
  - gmp
  - libtecla
  - buddy
  runtime:
  - gmp
  - libtecla
  - buddy
