name: trimesh
version: 5.1.0
source:
  url: https://github.com/mikedh/trimesh/archive/5.1.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - mapbox-earcut
  - pillow
  - charset-normalizer
  - colorlog
  - httpx
  - jsonschema
  - lxml
  - networkx
  - numpy
  - pycollada
  - pyglet
  - requests
  - scipy
  - shapely
  - svg-path
  - sympy
  - xxhash
  - rtree
  runtime:
  - charset-normalizer
  - colorlog
  - httpx
  - jsonschema
  - lxml
  - networkx
  - numpy
  - pillow
  - pycollada
  - pyglet
  - requests
  - scipy
  - shapely
  - svg-path
  - sympy
  - xxhash
  - rtree
