name: requests-credssp
version: 2.0.0
source:
  url: https://github.com/jborean93/requests-credssp/archive/refs/tags/v2.0.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - cryptography
  - gssapi
  - krb5
  - pyspnego
  - requests
  runtime:
  - cryptography
  - gssapi
  - krb5
  - pyspnego
  - requests
