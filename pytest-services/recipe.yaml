name: pytest-services
version: 2.2.2
source:
  url: https://github.com/pytest-dev/pytest-services/archive/v2.2.2.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools-scm
  - pylibmc
  - xorg-server
  - memcached
  - pytest-salt
  - requests
  - psutil
  - pytest
  - zc-lockfile
  runtime:
  - requests
  - psutil
  - pytest
  - zc-lockfile
