name: amdsmi
version: 7.1.1
source:
  url: https://github.com/amd/esmi_ib_library/archive/refs/tags/esmi_pkg_ver-4.2.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - gtest
  - libdrm
  runtime:
  - rocm-core
