name: hvac
version: 2.4.0
source:
  url: https://github.com/hvac/hvac/releases/download/v2.4.0/hvac-2.4.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - jwcrypto
  - parameterized
  - semantic-version
  - werkzeug
  - pyhcl
  - requests
  runtime:
  - pyhcl
  - requests
