name: django-auth-ldap
version: 5.3.0
source:
  url: https://github.com/django-auth-ldap/django-auth-ldap/archive/refs/tags/5.3.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools-scm
  - openldap
  - django
  - python-ldap
  runtime:
  - django
  - python-ldap
