name: jsonrpc-glib
version: 3.44.0
source:
  url: https://download.gnome.org/sources/jsonrpc-glib/3.44/jsonrpc-glib-3.44.2.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - glib-utils
  - pkgconfig
  - gi-docgen
  - glib
  - json-glib
  - gobject-introspection
  runtime:
  - glib
  - json-glib
  - gobject-introspection
