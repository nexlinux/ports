  runtime:
  - libXext
  - libXfixes
  - libXScrnSaver
  - pixman
  - libdrm
  - xorg-server
  - libX11
  - libxcb
  - libXcursor
  - libXdamage
  - libXinerama
  - libXrandr
  - libXrender
  - libxshmfence
  - libXtst
  - libudev
  - libXvMC
  - xcb-util
