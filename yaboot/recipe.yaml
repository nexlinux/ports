name: yaboot
version: 1.3.17-r4
source:
  url: https://downloads.sourceforge.net/e2fsprogs/e2fsprogs-1.42.13.tar.gz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  runtime:
  - yaboot-static
  - ibm-powerpc-utils
  - hfsutils
  - hfsplusutils
  - mac-fdisk
