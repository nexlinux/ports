name: logswan
version: 2.1.15
source:
  url: https://github.com/fcambus/logswan/archive/2.1.15.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - jansson
  - libmaxminddb
  runtime:
  - jansson
  - libmaxminddb
