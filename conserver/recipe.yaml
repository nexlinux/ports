name: conserver
version: 8.3.0
source:
  url: https://github.com/bstansell/conserver/releases/download/v8.3.0/conserver-8.3.0.tar.gz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - openpgp-keys-conserver
  - libcrypt
  - freeipmi
  - libgssglue
  - krb5
  - pam
  - openssl
  - tcp-wrappers
