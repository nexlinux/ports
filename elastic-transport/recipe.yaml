name: elastic-transport
version: 9.4.2
source:
  url: https://github.com/elastic/elastic-transport-python/archive/v9.4.2.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - aiohttp
  - httpx
  - opentelemetry-api
  - opentelemetry-sdk
  - orjson
  - requests
  - respx
  - trustme
  - certifi
  - sniffio
  - urllib3
  runtime:
  - certifi
  - sniffio
  - urllib3
