name: libjxl
version: 0.12.0
source:
  url: https://github.com/libjxl/libjxl/archive/refs/tags/v0.12.0.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - xdg-utils
  - brotli
  - highway
  - lcms
  - glib
  - gdk-pixbuf
  - giflib
  - libjpeg-turbo
  - openexr
  - libpng
  runtime:
  - shared-mime-info
