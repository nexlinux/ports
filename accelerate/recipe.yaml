name: accelerate
version: 1.14.0
source:
  url: https://github.com/huggingface/accelerate/archive/refs/tags/v1.14.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - networkx
  - clearml
  - pytorch
  - evaluate
  - torchdata
  - torchvision
  - transformers
  - huggingface_hub
  - numpy
  - packaging
  - psutil
  - pyyaml
  - safetensors
  runtime:
  - huggingface_hub
  - pytorch
  - numpy
  - packaging
  - psutil
  - pyyaml
  - safetensors
