name: libmatroska
version: 1.7.2
source:
  url: https://dl.matroska.org/downloads/libmatroska/libmatroska-1.7.2.tar.xz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - openpgp-keys-moritzbunkus
  - libebml
  runtime:
  - libebml
