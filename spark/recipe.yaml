name: spark
version: 2024.01.11-r2
source:
  url: http://mirror.koddos.net/gcc/releases/gcc-14.2.0/gcc-14.2.0.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - sphinx
  - sphinx-rtd-theme
  - gnatcoll-core
  - gpr
  - alt-ergo
  - why3-for-spark
  runtime:
  - gnatcoll-core
  - gpr
  - alt-ergo
  - why3-for-spark
