name: mat2
version: 0.14.0
source:
  url: https://github.com/jvoisin/mat2/archive/refs/tags/0.14.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - gdk-pixbuf-loader-webp
  - exiftool
  - ffmpeg
  - gdk-pixbuf
  - openpgp-keys-jvoisin-20230224-r9999
  - poppler
  - glib
  - pycairo
  - pygobject
  - librsvg
  - mutagen
  runtime:
  - poppler
  - glib
  - pycairo
  - pygobject
  - librsvg
  - mutagen
  - gdk-pixbuf
