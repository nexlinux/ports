name: libxslt
version: 1.1.45
source:
  url: https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.45.tar.xz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - pkgconfig
  runtime:
  - libxml2
  - libgcrypt
