name: gstreamermm
version: 1.10.0-r3
source:
  url: https://download.gnome.org/sources/gstreamermm/1.10/gstreamermm-1.10.0.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - mm-common
  - pkgconfig
  - doxygen
  - libxslt
  - graphviz
  - gstreamer-
  - gst-plugins-base-
  - glibmm
  - libsigc++
  runtime:
  - gstreamer-
  - gst-plugins-base-
  - glibmm
  - libsigc++
