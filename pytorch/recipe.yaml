name: pytorch
version: 2.14.1
source:
  url: https://github.com/pytorch/pytorch/archive/refs/tags/v2.14.1.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
