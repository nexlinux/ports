name: cask
version: 0.9.0
source:
  url: https://github.com/cask/cask/archive/v0.9.0.tar.gz
build:
- make -j$(nproc)
- make DESTDIR=$DESTDIR PREFIX=$PREFIX install
depends:
  build:
  - ansi
  - commander
  - epl
  - f
  - package-build
  - s
  - shut-up
  runtime:
  - ansi
  - commander
  - epl
  - f
  - package-build
  - s
  - shut-up
