  - libyaml
  - template-glib-3
  - vte-0
  - libxml2-2
  - webkit-gtk-2
  - cmark-0
  - editorconfig-core-c
  - ostree
  - libsoup-3
  - flatpak-1
  - libgit2
  - libgit2-glib-1
  - clang
  - libspelling-0
  - sysprof-45
