name: gnome-taquin
version: 3.38.1-r1
source:
  url: https://download.gnome.org/sources/gnome-taquin/3.38/gnome-taquin-3.38.1.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - libxml2
  - itstool
  - gettext
  - pkgconfig
  - gdk-pixbuf
  - gsound
  - librsvg
  - glib
  - gtk+
  runtime:
  - glib
  - gsound
  - gtk+
  - librsvg
