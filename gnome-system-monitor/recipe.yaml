name: gnome-system-monitor
version: '50.0'
source:
  url: https://download.gnome.org/sources/gnome-system-monitor/50/gnome-system-monitor-50.0.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - catch
  - glib-utils
  - itstool
  - gettext
  - pkgconfig
  - polkit
  - glibmm
  - glib
  - gtk
  - gtkmm
  - libgtop
  - libadwaita
  - librsvg
  - systemd
  runtime:
  - glibmm
  - glib
  - gtk
  - gtkmm
  - libgtop
  - libadwaita
  - librsvg
  - systemd
