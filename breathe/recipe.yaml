name: breathe
version: 4.36.0
source:
  url: https://github.com/breathe-doc/breathe/archive/v4.36.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - doxygen
  - docutils
  - sphinx
  - texlive-bibtexextra
  - texlive-fontsextra
  - texlive-fontutils
  - texlive-latex
  - texlive-latexextra
  runtime:
  - doxygen
  - docutils
  - sphinx
  - texlive-bibtexextra
  - texlive-fontsextra
  - texlive-fontutils
  - texlive-latex
  - texlive-latexextra
