name: myst-parser
version: 5.1.0
source:
  url: https://github.com/executablebooks/MyST-Parser/archive/v5.1.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - beautifulsoup4
  - defusedxml
  - linkify-it-py
  - sphinx
  - docutils
  - jinja2
  - markdown-it-py
  - mdit-py-plugins
  - pyyaml
  runtime:
  - docutils
  - jinja2
  - markdown-it-py
  - mdit-py-plugins
  - pyyaml
  - sphinx
