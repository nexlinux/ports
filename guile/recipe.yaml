name: guile
version: 3.0.11
source:
  url: https://ftp.gnu.org/gnu/guile/guile-3.0.11.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - pkgconfig
  - libtool
  - gettext
  - boehm-gc
  - gmp
  - libffi
  - libatomic_ops
  - libunistring
  - ncurses
  - readline
  - libcrypt
  - guile
  runtime:
  - boehm-gc
  - gmp
  - libffi
  - libatomic_ops
  - libunistring
  - ncurses
  - readline
  - libcrypt
  - guile
