name: jupyterlab
version: 4.6.3
source:
  url: https://github.com/jupyterlab/jupyterlab/archive/refs/tags/v4.6.3.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - hatch-jupyter-builder
  - requests
  - requests-cache
  - async-lru
  - httpx
  - ipykernel
  - jinja2
  - jupyter-builder
  - jupyter-core
  - jupyter-lsp
  - jupyter-server
  - jupyterlab-server
  - notebook-shim
  - packaging
  - setuptools
  - tornado
  - traitlets
  - nodejs
  runtime:
  - async-lru
  - httpx
  - ipykernel
  - jinja2
  - jupyter-builder
  - jupyter-core
  - jupyter-lsp
  - jupyter-server
  - jupyterlab-server
  - notebook-shim
  - packaging
  - setuptools
  - tornado
  - traitlets
  - nodejs
