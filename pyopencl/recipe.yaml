name: pyopencl
version: 2026.1.2
source:
  url: https://github.com/pyopencl/pyopencl/archive/refs/tags/v2026.1.2.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - numpy
  - nanobind
  - pocl
  - libglvnd
  runtime:
  - mako
  - numpy
  - platformdirs
  - pytools
