name: gphotofs
version: '1.0'
source:
  url: https://github.com/gphoto/gphotofs/releases/download/v1.0/gphotofs-1.0.tar.bz2
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - gettext
  - pkgconfig
  - openpgp-keys-marcusmeissner
  - glib
  - libgphoto2
  - fuse
  runtime:
  - glib
  - libgphoto2
  - fuse
