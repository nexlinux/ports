name: mypy
version: 1.20.2
source:
  url: https://github.com/python/mypy/archive/v1.20.2.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - types-psutil
  - types-setuptools
  - attrs
  - filelock
  - lxml
  - stubgen
  - librt
  - mypy-extensions
  - pathspec
  - typing-extensions
  runtime:
  - stubgen
  - librt
  - mypy-extensions
  - pathspec
  - typing-extensions
