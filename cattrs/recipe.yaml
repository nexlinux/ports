name: cattrs
version: 26.1.0
source:
  url: https://github.com/python-attrs/cattrs/archive/v26.1.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - hatch-vcs
  - immutables
  - msgpack
  - pymongo
  - pyyaml
  - tomlkit
  - tomli-w
  - ujson
  - cbor2
  - orjson
  - attrs
  - typing-extensions
  runtime:
  - attrs
  - typing-extensions
