name: lttng-tools
version: 2.14.2
source:
  url: https://lttng.org/files/lttng-tools/lttng-tools-2.14.2.tar.bz2
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - pkgconfig
  - babeltrace
  - openpgp-keys-jeremiegalarneau
  - userspace-rcu
  - popt
  - libxml2
  - kmod
  - lttng-ust
  runtime:
  - userspace-rcu
  - popt
  - libxml2
  - kmod
  - lttng-ust
