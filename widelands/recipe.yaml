name: widelands
version: 1.3.1
source:
  url: https://github.com/widelands/widelands/archive/refs/tags/v1.3.1.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - icu
  - glew
  - libglvnd
  - libpng
  - libsdl2
  - sdl2-image
  - sdl2-mixer
  - sdl2-ttf
  - libintl
  - minizip
  runtime:
  - icu
  - glew
  - libglvnd
  - libpng
  - libsdl2
  - sdl2-image
  - sdl2-mixer
  - sdl2-ttf
  - libintl
  - minizip
