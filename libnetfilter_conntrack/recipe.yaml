name: libnetfilter_conntrack
version: 1.1.1
source:
  url: https://www.netfilter.org/projects/libnetfilter_conntrack/files/libnetfilter_conntrack-1.1.1.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - pkgconfig
  - openpgp-keys-netfilter
  - libmnl-1
  - libnfnetlink-1
  runtime:
  - libmnl-1
  - libnfnetlink-1
