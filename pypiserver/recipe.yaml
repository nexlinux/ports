name: pypiserver
version: 2.4.1
source:
  url: https://github.com/pypiserver/pypiserver/archive/v2.4.1.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools-git
  - build
  - libpass
  - setuptools
  - webtest
  - bottle
  - packaging
  - pip
  - importlib-resources
  - legacy-cgi
  runtime:
  - bottle
  - packaging
  - pip
  - importlib-resources
  - legacy-cgi
