name: four-in-a-row
version: 3.38.1-r1
source:
  url: https://download.gnome.org/sources/four-in-a-row/3.38/four-in-a-row-3.38.1.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - appstream-glib
  - itstool
  - gettext
  - pkgconfig
  - gsound
  - librsvg
  - glib
  - gtk+
  runtime:
  - glib
  - gsound
  - gtk+
  - librsvg
