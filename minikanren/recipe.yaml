name: minikanren
version: 1.0.5
source:
  url: https://github.com/pythological/kanren/archive/v1.0.5.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools-scm
  - cons
  - etuples
  - logical-unification
  - multipledispatch
  - toolz
  - typing-extensions
  runtime:
  - cons
  - etuples
  - logical-unification
  - multipledispatch
  - toolz
  - typing-extensions
