name: flameshot
version: 13.1.0-r1
source:
  url: https://gitlab.com/mattbas/Qt-Color-Widgets/-/archive/8491078434b24cba295b5e41cc0d2a94c7049a5b/-qtcolorwidgets-84910784.tar.bz2
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - qttools
  - kdsingleapplication
  - qtbase
  - qtsvg
  - dbus
  - kguiaddons
