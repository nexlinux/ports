name: python-gitlab
version: 5.6.0
source:
  url: https://github.com/python-gitlab/python-gitlab/archive/refs/tags/v5.6.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - anyio
  - pytest-console-scripts
  - pyyaml
  - responses
  - respx
  - trio
  - requests
  - requests-toolbelt
  runtime:
  - requests
  - requests-toolbelt
