name: cvxopt
version: 1.3.3
source:
  url: https://github.com/cvxopt/cvxopt/archive/1.3.3.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools-scm
  - pkgconfig
  - blas
  - lapack
  - amd
  - cholmod
  - colamd
  - suitesparseconfig
  - umfpack
  - dsdp
  - fftw
  - glpk
  - gsl
