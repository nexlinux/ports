name: libgit2-glib
version: 1.2.1-r1
source:
  url: https://download.gnome.org/sources/libgit2-glib/1.2/libgit2-glib-1.2.1.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - glib-utils
  - pkgconfig
  - gi-docgen
  - gobject-introspection
  - glib
  - libgit2
  - pygobject
  runtime:
  - gobject-introspection
  - glib
  - libgit2
  - pygobject
