name: translate-toolkit
version: 3.19.19
source:
  url: https://github.com/translate/translate/archive/3.19.19.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - phply
  - iso-codes
  - chardet
  - cheroot
  - levenshtein
  - lxml
  - mistletoe
  - pyparsing
  - ruamel-yaml
  - tomlkit
  - unicode-segmentation-rs
  - wcwidth
  - gettext
  - utidylib
  - vobject
  - iniparse
  - gaupol
  - pyyaml
  runtime:
  - iso-codes
  - chardet
  - cheroot
  - levenshtein
  - lxml
  - mistletoe
  - pyparsing
  - ruamel-yaml
  - tomlkit
  - unicode-segmentation-rs
  - wcwidth
  - gettext
  - utidylib
  - vobject
  - iniparse
  - gaupol
  - pyyaml
