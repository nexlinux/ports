name: warzone2100
version: 4.7.0
source:
  url: https://downloads.sourceforge.net/warzone2100/releases/4.7.0/warzone2100_src.tar.xz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - zip
  - asciidoc
  - basis_universal
  - pkgconfig
  - gettext
  - fribidi
  - physfs
  - sqlite
  - libsodium
  - libzip
  - protobuf
  - freetype
  - harfbuzz
  - libjpeg-turbo
  - libogg
  - libpng
  - libsdl3
  - libtheora
  - libvorbis
  - openal
  - opus
  - opusfile
  - miniupnpc
  - curl
  - zlib
  - libintl
  runtime:
  - dejavu
