name: znc
version: 1.10.1
source:
  url: https://znc.in/releases/archive/znc-1.10.1.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - pkgconfig
  - gettext
  - swig
  - perl
  - qtbase
  runtime:
  - znc
