name: pysolfc
version: 3.6.1
source:
  url: https://downloads.sourceforge.net/pysolfc/pysolfc-3.6.1.tar.xz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - attrs
  - configobj
  - pysol-cards
  - random2
  - pygame
  - pillow
  - tktable
  runtime:
  - attrs
  - configobj
  - pysol-cards
  - random2
  - pygame
  - pillow
  - tktable
