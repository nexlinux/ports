name: gsmartcontrol
version: 2.0.1
source:
  url: https://github.com/ashaduri/gsmartcontrol/archive/refs/tags/v2.0.1.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - gettext
  - pkgconfig
  - glibmm
  - gtkmm
  - libsigc++
  - smartmontools
  runtime:
  - xmessage
