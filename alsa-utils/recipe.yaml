name: alsa-utils
version: 1.2.15.2
source:
  url: https://www.alsa-project.org/files/pub/utils/alsa-utils-1.2.15.2.tar.bz2
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - pkgconfig
  - xmlto
  - openpgp-keys-alsa
  - alsa-lib-
  - libsamplerate
  - libffado
  - ncurses
  - fftw
  runtime:
  - selinux-alsa
