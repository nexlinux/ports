name: aiohttp-socks
version: 0.11.0
source:
  url: https://github.com/romis2012/aiohttp-socks/archive/v0.11.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - trustme
  - attrs
  - yarl
  - flask
  - tiny-proxy
  - aiohttp
  - python-socks
  runtime:
  - aiohttp
  - python-socks
