name: pyscreenshot
version: '3.1'
source:
  url: https://github.com/ponty/pyscreenshot/archive/3.1.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - pillow
  - pygame
  - python-xlib
  - pyvirtualdisplay
  - imagemagick
  - pqiv
  - scrot
  - xdpyinfo
  - easyprocess
  - entrypoint2
  - jeepney
  - mss
  runtime:
  - easyprocess
  - entrypoint2
  - jeepney
  - mss
