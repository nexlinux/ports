name: openvpn
version: 2.7.4
source:
  url: https://build.openvpn.net/downloads/releases/openvpn-2.7.4.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - pkgconfig
  - iproute2
  - lz4
  - lzo-1
  - mbedtls
  - openssl-1
  - pam
  - pkcs11-helper-1
  - libselinux
  - systemd
  - ovpn-dco-0
  - libnl-3
  - libcap-ng
  runtime:
  - openvpn
  - selinux-openvpn
