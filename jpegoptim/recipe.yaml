name: jpegoptim
version: 1.5.6
source:
  url: https://github.com/tjko/jpegoptim/archive/refs/tags/v1.5.6.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - libjpeg-turbo
  runtime:
  - libjpeg-turbo
