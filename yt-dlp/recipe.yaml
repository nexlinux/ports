name: yt-dlp
version: 2026.07.04
source:
  url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.07.04/yt-dlp.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - ffmpeg
  - pycryptodome
  - yt-dlp-ejs
  - deno-bin
  runtime:
  - pycryptodome
  - yt-dlp-ejs
  - deno-bin
