name: caribou
version: 0.4.21-r9
source:
  url: https://download.gnome.org/sources/caribou/0.4/caribou-0.4.21.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - intltool
  - pkgconfig
  - at-spi2-core
  - pygobject
  - gobject-introspection
  - libgee
  - libxml2
  - clutter
  - gtk+
  - libX11
  - libxklavier
  - libXtst
  runtime:
  - glib
  - gsettings-desktop-schemas
  - librsvg
  - dbus
