name: gvim-classic
version: 8.3.0
source:
  url: https://git.sr.ht/~sircmpwn/vim-classic/archive/v8.3.0.tar.gz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - openpgp-keys-ddevault
  runtime:
  - gvim
  - vim-classic-core-
  - eselect-vi
  - ncurses
  - libICE
  - libSM
  - libXext
  - libXt
  - acl
  - motif
  - gtk+
  - libXft
  - cscope
  - libintl
  - perl
  - racket
  - libselinux
  - libcanberra
  - tcl
