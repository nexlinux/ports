name: nattka
version: 0.4.3
source:
  url: https://github.com/gentoo/nattka/archive/v0.4.3.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - flit-core
  - vcrpy
  - lxml
  - requests
  - snakeoil
  - pkgcheck
  - git
  - pkgcore
  - networkx
  runtime:
  - lxml
  - requests
  - snakeoil
  - pkgcheck
  - git
  - pkgcore
  - networkx
