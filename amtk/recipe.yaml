name: amtk
version: 5.6.1
source:
  url: https://download.gnome.org/sources/amtk/5.6/amtk-5.6.1.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - glib-utils
  - gtk-doc
  - docbook-xml-dtd
  - gettext
  - pkgconfig
  - glib
  - gtk+
  - gobject-introspection
  runtime:
  - glib
  - gtk+
  - gobject-introspection
