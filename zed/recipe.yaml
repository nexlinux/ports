name: zed
version: 3.2.3
source:
  url: https://github.com/ocaml-community/zed/archive/3.2.3.tar.gz
build:
- make -j$(nproc)
- make DESTDIR=$DESTDIR PREFIX=$PREFIX install
depends:
  build:
  - alcotest
  - react
  - result
  - uchar
  - uucp
  - uuseg
  - uutf
  runtime:
  - react
  - result
  - uchar
  - uucp
  - uuseg
  - uutf
