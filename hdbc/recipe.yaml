name: hdbc
version: 2.4.0.4
source:
  url: https://github.com/hdbc/hdbc/archive/refs/tags/2.4.0.4.tar.gz
build:
- make -j$(nproc)
- make DESTDIR=$DESTDIR PREFIX=$PREFIX install
depends:
  build:
  - convertible
  - old-time
  - utf8-string
  - ghc
  runtime:
  - convertible
  - old-time
  - utf8-string
  - ghc
