name: behave
version: 1.3.3
source:
  url: https://github.com/behave/behave/archive/refs/tags/v1.3.3.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - wheel
  - assertpy
  - chardet
  - freezegun
  - mock
  - path
  - pyhamcrest
  - colorama
  - cucumber-expressions
  - cucumber-tag-expressions
  - parse
  - parse-type
  - six
  - tomli
  runtime:
  - colorama
  - cucumber-expressions
  - cucumber-tag-expressions
  - parse
  - parse-type
  - six
  - tomli
