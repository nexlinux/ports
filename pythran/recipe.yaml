name: pythran
version: 0.19.0
source:
  url: https://github.com/serge-sans-paille/pythran/archive/0.19.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - pip
  - packaging
  - scipy
  - wheel
  - cblas
  - setuptools-declarative-requirements
  - boost
  - xsimd
  - beniget
  - gast
  - numpy
  - ply
  - setuptools
  runtime:
  - boost
  - xsimd
  - beniget
  - gast
  - numpy
  - ply
  - setuptools
