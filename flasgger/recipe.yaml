name: flasgger
version: 0.9.7.1
source:
  url: https://github.com/flasgger/flasgger/archive/refs/tags/v0.9.7.1.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - flask
  - pyyaml
  - jsonschema
  - mistune
  - six
  - packaging
  runtime:
  - flask
  - pyyaml
  - jsonschema
  - mistune
  - six
  - packaging
