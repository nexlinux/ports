name: bash-completion
version: 2.17.0
source:
  url: https://github.com/scop/bash-completion/releases/download/2.17.0/bash-completion-2.17.0.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - pexpect
  - pytest
  - pytest-xdist
  - bash
  - miscfiles
  - tree
  - mc
  runtime:
  - bash
  - miscfiles
  - tree
  - mc
