name: virtme-ng
version: '1.41'
source:
  url: https://github.com/arighi/virtme-ng/archive/refs/tags/v1.41.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - argparse-manpage
  - argcomplete
  - requests
  runtime:
  - qemu
  - virtiofsd
  - openssh
  - socat
  - busybox
