name: tomcat-native
version: 1.3.9
source:
  url: https://archive.apache.org/dist/tomcat/tomcat-connectors/native/1.3.9/source/tomcat-native-1.3.9-src.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - openpgp-keys-apache-tomcat
  runtime:
  - apr
  - openssl
  - '3'
  - jre
