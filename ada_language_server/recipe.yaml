  - gprbuild
  - e3-testsuite
  - ada_libfswatch
  - AdaSAT
  - gnatcoll-bindings
  - gnatcoll-core
  - gnatdoc
  - gnatformat
  - gpr
  - lal-refactor
  - langkit
  - libadalang
  - libadalang-tools
  - libgpr
  - prettier-ada
  - spawn
  - templates-parser
  - vss-text
  - vss-extra
  - xmlada
  - gmp
  - fswatch
  runtime:
  - ada_libfswatch
  - AdaSAT
  - gnatcoll-bindings
  - gnatcoll-core
  - gnatdoc
  - gnatformat
  - gpr
  - lal-refactor
  - langkit
  - libadalang
  - libadalang-tools
  - libgpr
  - prettier-ada
  - spawn
  - templates-parser
  - vss-text
  - vss-extra
  - xmlada
  - gmp
  - fswatch
