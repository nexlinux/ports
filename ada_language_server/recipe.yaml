name: ada_language_server
version: 26.0.202507021
source:
  url: https://github.com/AdaCore/ada_language_server/archive/refs/tags/26.0.202507021.tar.gz
build:
- make -j$(nproc)
- make DESTDIR=$DESTDIR PREFIX=$PREFIX install
depends:
