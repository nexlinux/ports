name: easytag
version: 2.4.3-r7
source:
  url: https://download.gnome.org/sources/easytag/2.4/easytag-2.4.3.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - docbook-xml-dtd
  - yelp-tools
  - glib-utils
  - appstream-glib
  - libxml2
  - libxslt
  - intltool
  - gettext
  - pkgconfig
  - desktop-file-utils
  - glib
  - libcanberra-gtk3
  - libcanberra
  - gtk+
  - flac
  - id3lib
  - libid3tag
  - taglib
  - opus
  - opusfile
  - speex
  - libogg
  - libvorbis
  - wavpack
  runtime:
  - glib
  - libcanberra-gtk3
  - libcanberra
  - gtk+
  - flac
  - id3lib
  - libid3tag
  - taglib
  - opus
  - opusfile
  - speex
  - libogg
  - libvorbis
  - wavpack
