name: quart
version: 0.21.0
source:
  url: https://github.com/pallets/quart/archive/0.21.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - python-dotenv
  - aiofiles
  - blinker
  - click
  - flask
  - hypercorn
  - itsdangerous
  - jinja2
  - markupsafe
  - werkzeug
  runtime:
  - aiofiles
  - blinker
  - click
  - flask
  - hypercorn
  - itsdangerous
  - jinja2
  - markupsafe
  - werkzeug
