name: superlu_mt
version: 4.0.2
source:
  url: https://github.com/xiaoyeli/superlu_mt/archive/refs/tags/v4.0.2.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - pkgconfig
  - tcsh
  - blas
  runtime:
  - blas
