name: autosuspend
version: 7.2.0
source:
  url: https://github.com/languitar/autosuspend/archive/v7.2.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - freezegun
  - icalendar
  - jsonpath-ng
  - pygobject
  - pytest-datadir
  - pytest-httpserver
  - pytest-mock
  - python-dbusmock
  - python-mpd2
  - pytz
  - tzlocal
  - portalocker
  - psutil
  - dbus-python
  runtime:
  - portalocker
  - psutil
  - dbus-python
  - python-mpd2
