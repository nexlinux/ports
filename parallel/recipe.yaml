name: parallel
version: '20250722'
source:
  url: https://ftp.gnu.org/gnu/parallel/parallel-20250722.tar.bz2
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - openpgp-keys-oletange
  - perl
  - Devel-Size
  - Text-CSV
  runtime:
  - perl
  - Devel-Size
  - Text-CSV
