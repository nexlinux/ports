name: nftables
version: 1.1.3
source:
  url: https://netfilter.org/projects/nftables/files/nftables-1.1.3.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - yacc
  runtime:
  - libmnl
  - libnftnl
  - gmp
  - jansson
  - readline
  - iptables
