name: mitmproxy
version: 12.3.0
source:
  url: https://github.com/mitmproxy/mitmproxy/archive/v12.3.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - click
  - requests
  - brotli
  - aioquic
  - argon2-cffi
  - asgiref
  - backports-zstd
  - bcrypt
  - certifi
  - cryptography
  - flask
  - h11
  - h2
  - hyperframe
  - kaitaistruct
  - ldap3
  - mitmproxy-rs
  - msgpack
  - publicsuffix2
  - pyopenssl
  - pyparsing
  - pyperclip
  - ruamel-yaml
  - sortedcontainers
  - tornado
  - typing-extensions
  - urwid
  - wsproto
  runtime:
  - brotli
  - aioquic
  - argon2-cffi
  - asgiref
  - backports-zstd
  - bcrypt
  - certifi
  - cryptography
  - flask
  - h11
  - h2
  - hyperframe
  - kaitaistruct
  - ldap3
  - mitmproxy-rs
  - msgpack
  - publicsuffix2
  - pyopenssl
  - pyparsing
  - pyperclip
  - ruamel-yaml
  - sortedcontainers
  - tornado
  - typing-extensions
  - urwid
  - wsproto
