name: gupnp-dlna
version: 0.12.0-r1
source:
  url: https://download.gnome.org/sources/gupnp-dlna/0.12/gupnp-dlna-0.12.0.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - pkgconfig
  - gtk-doc
  runtime:
  - glib
  - libxml2
  - gstreamer
  - gst-plugins-base
  - gobject-introspection
