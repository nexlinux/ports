name: opentelemetry-sdk
version: 1.44.0
source:
  url: https://github.com/open-telemetry/opentelemetry-python/archive/refs/tags/v1.44.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - opentelemetry-api-
  - opentelemetry-semantic-conventions-
  - typing-extensions
  runtime:
  - opentelemetry-api-
  - opentelemetry-semantic-conventions-
  - typing-extensions
