name: pypugjs
version: 7.0.0
source:
  url: https://github.com/kakulukia/pypugjs/archive/v7.0.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - django
  - flask
  - jinja2
  - mako
  - tornado
  - six
  - charset-normalizer
  runtime:
  - six
  - charset-normalizer
