name: requests
version: 2.34.2
source:
  url: https://github.com/requests/requests/releases/download/v2.34.2/requests-2.34.2.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - httpbin
  - pysocks
  - trustme
  - certifi
  - charset-normalizer
  - idna
  - urllib3
  runtime:
  - certifi
  - charset-normalizer
  - idna
  - urllib3
  - pysocks
