name: apparmor
version: 5.0.2
source:
  url: https://gitlab.com/apparmor/apparmor/-/archive/v5.0.2/apparmor-v5.0.2.tar.bz2
build:
- make -j$(nproc)
- make DESTDIR=$DESTDIR PREFIX=$PREFIX install
depends:
  build:
  - which
  - yacc
  - gettext
  - lex
  - latex2html
  - perl
  - openpgp-keys-apparmor
  - libapparmor-
  runtime:
  - libapparmor-
