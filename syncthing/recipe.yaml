name: syncthing
version: 2.1.3
source:
  url: https://github.com/syncthing/syncthing/releases/download/v2.1.3/syncthing-source-v2.1.3.tar.gz
build:
- go build -o syncthing
- mkdir -p $DESTDIR$PREFIX/bin
- cp syncthing $DESTDIR$PREFIX/bin/
depends:
  build:
  - go
  - openpgp-keys-syncthing
  - sqlite
  runtime:
  - syncthing
  - stdiscosrv
  - strelaysrv
  - selinux-syncthing
