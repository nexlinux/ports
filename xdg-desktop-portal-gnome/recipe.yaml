name: xdg-desktop-portal-gnome
version: '50.0'
source:
  url: https://download.gnome.org/sources/xdg-desktop-portal-gnome/50/xdg-desktop-portal-gnome-50.0.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - gdbus-codegen
  - gettext
  - pkgconfig
  - wayland-scanner
  - glib
  - gsettings-desktop-schemas
  - gnome-desktop
  - libadwaita
  - fontconfig
  - dbus
  - xdg-desktop-portal
  - xdg-desktop-portal-gtk
  - gtk
  - libX11
  - wayland
