name: setuptools-rust
version: 1.13.0
source:
  url: https://github.com/PyO3/setuptools-rust/archive/v1.13.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools
  - beautifulsoup4
  - cffi
  - lxml
  - semantic-version
  runtime:
  - semantic-version
  - setuptools
