name: requests-cache
version: 1.3.2
source:
  url: https://github.com/requests-cache/requests-cache/archive/v1.3.2.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - itsdangerous
  - responses
  - rich
  - ujson
  - time-machine
  - attrs
  - cattrs
  - platformdirs
  - requests
  - urllib3
  - url-normalize
  runtime:
  - attrs
  - cattrs
  - platformdirs
  - requests
  - urllib3
  - url-normalize
