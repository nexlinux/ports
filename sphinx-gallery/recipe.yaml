name: sphinx-gallery
version: 0.21.0
source:
  url: https://github.com/sphinx-gallery/sphinx-gallery/archive/refs/tags/v0.21.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools-scm
  - joblib
  - matplotlib
  - pillow
  - sphinx
  runtime:
  - matplotlib
  - pillow
  - sphinx
