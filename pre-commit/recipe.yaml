name: pre-commit
version: 4.5.1
source:
  url: https://github.com/pre-commit/pre-commit/archive/refs/tags/v4.5.1.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - coreutils
  - re-assert
  - git
  - cfgv
  - identify
  - nodeenv
  - pyyaml
  runtime:
  - git
  - cfgv
  - identify
  - nodeenv
  - pyyaml
