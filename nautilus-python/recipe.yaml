name: nautilus-python
version: 4.2.0
source:
  url: https://download.gnome.org/sources/nautilus-python/4.2/nautilus-python-4.2.0.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - gtk-doc
  - gtk-doc-am
  - pkgconfig
  - glib
  - pygobject
  - nautilus
  runtime:
  - glib
  - pygobject
  - nautilus
