name: borgmatic
version: 2.0.13
source:
  url: https://github.com/borgmatic-collective/borgmatic/archive/refs/tags/2.0.13.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - apprise
  - flexmock
  - borgbackup
  - jsonschema
  - packaging
  - requests
  - ruamel-yaml
  runtime:
  - borgbackup
  - jsonschema
  - packaging
  - requests
  - ruamel-yaml
  - apprise
