name: conmon
version: 2.1.11
source:
  url: https://github.com/containers/conmon/archive/v2.1.11.tar.gz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - go-md2man
  - glib
  - libseccomp
  - systemd
  runtime:
  - glib
  - libseccomp
  - systemd
