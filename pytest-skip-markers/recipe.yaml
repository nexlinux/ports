name: pytest-skip-markers
version: 1.5.2
source:
  url: https://github.com/saltstack/pytest-skip-markers/archive/1.5.2.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools-scm
  - pip
  - pytest
  - attrs
  - distro
  runtime:
  - pytest
  - attrs
  - distro
