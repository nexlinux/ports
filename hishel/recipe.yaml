name: hishel
version: 1.3.0
source:
  url: https://github.com/karpetrosyan/hishel/archive/refs/tags/1.3.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - hatch-fancy-pypi-readme
  - redis
  - anysqlite
  - boto3
  - fakeredis
  - inline-snapshot
  - time-machine
  - trio
  - anyio
  - httpx
  - msgpack
  - typing-extensions
  runtime:
  - anyio
  - anysqlite
  - httpx
  - msgpack
  - typing-extensions
