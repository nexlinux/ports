name: latexdiff
version: 1.3.4
source:
  url: https://github.com/ftilmann/latexdiff/archive/1.3.4.tar.gz
build:
- make -j$(nproc)
- make DESTDIR=$DESTDIR PREFIX=$PREFIX install
depends:
  build:
  - tcsh
  - perl
  - latex-base
  - texlive-plaingeneric
  - Algorithm-Diff
  runtime:
  - perl
  - latex-base
  - texlive-plaingeneric
  - Algorithm-Diff
