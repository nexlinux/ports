name: wargus
version: 3.3.2
source:
  url: https://github.com/Wargus/wargus/archive/v3.3.2.tar.gz
build:
- cmake -B build -DCMAKE_INSTALL_PREFIX=$PREFIX
- cmake --build build -j$(nproc)
- DESTDIR=$DESTDIR cmake --install build
depends:
  build:
  - pkgconfig
  - stratagus-
  - libpng
  - zlib
  - gtk+
  - libX11
  - stormlib
  - wargus-data
