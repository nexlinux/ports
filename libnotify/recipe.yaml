name: libnotify
version: 0.8.8
source:
  url: https://download.gnome.org/sources/libnotify/0.8/libnotify-0.8.8.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - glib-utils
  - pkgconfig
  - docbook-xsl-ns-stylesheets
  - libxslt
  - gi-docgen
  - docbook-xml-dtd
  - python
  - python-dbusmock
  - gtk
  - dbus
  - xvfb-run
  - glib
  - gdk-pixbuf
  - gobject-introspection
  runtime:
  - glib
  - gdk-pixbuf
  - gobject-introspection
