name: streamlink
version: 8.5.0
source:
  url: https://github.com/streamlink/streamlink/releases/download/8.5.0/streamlink-8.5.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - ffmpeg
  - certifi
  - chardet
  - charset-normalizer
  - requests
  - isodate
  - lxml
  - websocket-client
  - pycountry
  - pycryptodome
  - pysocks
  - trio
  - trio-websocket
  - urllib3
  runtime:
  - ffmpeg
  - certifi
  - chardet
  - charset-normalizer
  - requests
  - isodate
  - lxml
  - websocket-client
  - pycountry
  - pycryptodome
  - pysocks
  - trio
  - trio-websocket
  - urllib3
