name: authlib
version: 1.7.2
source:
  url: https://github.com/authlib/authlib/archive/refs/tags/v1.7.2.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - anyio
  - cachelib
  - django
  - flask
  - httpx
  - joserfc
  - pycryptodome-3
  - requests
  - starlette
  - cryptography
  runtime:
  - cryptography
  - django
  - joserfc
