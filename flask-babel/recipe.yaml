name: flask-babel
version: 4.0.0
source:
  url: https://github.com/python-babel/flask-babel/archive/refs/tags/v4.0.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - babel
  - flask
  - jinja2
  - pytz
  - werkzeug
  runtime:
  - babel
  - flask
  - jinja2
  - pytz
  - werkzeug
