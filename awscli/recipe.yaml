name: awscli
version: 1.45.61
source:
  url: https://github.com/aws/aws-cli/archive/1.45.61.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - packaging
  - botocore-
  - colorama
  - docutils
  - rsa
  - s3transfer-0
  - pyyaml
  - awscli-bin
  runtime:
  - botocore-
  - colorama
  - docutils
  - rsa
  - s3transfer-0
  - pyyaml
  - awscli-bin
