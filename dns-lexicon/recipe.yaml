name: dns-lexicon
version: 3.25.2
source:
  url: https://github.com/dns-lexicon/dns-lexicon/archive/v3.25.2.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - boto3
  - zeep
  - vcrpy
  - beautifulsoup4
  - cryptography
  - dnspython
  - pyotp
  - pyyaml
  - requests
  - requests-unixsocket
  - tldextract
  runtime:
  - beautifulsoup4
  - cryptography
  - dnspython
  - pyotp
  - pyyaml
  - requests
  - requests-unixsocket
  - tldextract
