name: tavern
version: 3.5.0
source:
  url: https://github.com/taverntesting/tavern/archive/3.5.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - colorlog
  - faker
  - paho-mqtt
  - hypothesis
  - jmespath
  - jsonschema
  - pydantic
  - pyjwt
  - pykwalify
  - pytest
  - python-box
  - pyyaml
  - requests
  - simpleeval
  - stevedore
  runtime:
  - hypothesis
  - jmespath
  - jsonschema
  - pydantic
  - pyjwt
  - pykwalify
  - pytest
  - python-box
  - pyyaml
  - requests
  - simpleeval
  - stevedore
