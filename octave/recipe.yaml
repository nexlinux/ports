name: octave
version: 11.1.0
source:
  url: https://ftp.gnu.org/gnu/octave/octave-11.1.0.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - gperf
  - pkgconfig
  - texlive-fontsrecommended
  - texlive-plaingeneric
  - texlive-metapost
  - latex-base
  - qttools
  - pax-utils
  - jre
  runtime:
  - jre
