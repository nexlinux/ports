name: pytest-bdd
version: 9.0.0
source:
  url: https://github.com/pytest-dev/pytest-bdd/archive/refs/tags/9.0.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - gherkin-official
  - mako
  - packaging
  - parse
  - parse-type
  - pytest
  - typing-extensions
  runtime:
  - gherkin-official
  - mako
  - packaging
  - parse
  - parse-type
  - pytest
  - typing-extensions
