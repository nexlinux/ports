name: django-polymorphic
version: 4.11.7
source:
  url: https://github.com/django-commons/django-polymorphic/archive/v4.11.7.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - djangorestframework
  - packaging
  - django
  - typing-extensions
  runtime:
  - django
  - typing-extensions
