name: elasticsearch
version: 9.4.1
source:
  url: https://github.com/elastic/elasticsearch-py/archive/v9.4.1.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - httpx
  - mapbox-vector-tile
  - numpy
  - opentelemetry-api
  - opentelemetry-sdk
  - pandas
  - pyarrow
  - pydantic
  - python-dateutil
  - pyyaml
  - trio
  - unasync
  - aiohttp
  - anyio
  - elastic-transport
  - orjson
  - requests
  - sniffio
  - typing-extensions
  runtime:
  - aiohttp
  - anyio
  - elastic-transport
  - orjson
  - python-dateutil
  - requests
  - sniffio
  - typing-extensions
