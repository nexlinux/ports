name: pygithub
version: 2.9.1
source:
  url: https://github.com/pygithub/pygithub/archive/refs/tags/v2.9.1.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - setuptools-scm
  - responses
  - cryptography
  - pyjwt
  - pynacl
  - requests
  - typing-extensions
  runtime:
  - cryptography
  - pyjwt
  - pynacl
  - requests
  - typing-extensions
