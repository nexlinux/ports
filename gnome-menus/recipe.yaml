name: gnome-menus
version: 3.36.0-r1
source:
  url: https://download.gnome.org/sources/gnome-menus/3.36/gnome-menus-3.36.0.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - gettext
  - pkgconfig
  - glib
  - gobject-introspection
  runtime:
  - glib
  - gobject-introspection
