name: gtk-vnc
version: 1.5.0
source:
  url: https://download.gnome.org/sources/gtk-vnc/1.5/gtk-vnc-1.5.0.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - perl
  - glib-utils
  - gettext
  - pkgconfig
  - gi-docgen
  - glib
  - gmp
  - gdk-pixbuf
  - gnutls
  - zlib
  - gtk+
  - cairo
  - libucontext
  - gobject-introspection
  - libpulse
  - cyrus-sasl
  - libX11
  runtime:
  - glib
  - gmp
  - gdk-pixbuf
  - gnutls
  - zlib
  - gtk+
  - cairo
  - libucontext
  - gobject-introspection
  - libpulse
  - cyrus-sasl
  - libX11
