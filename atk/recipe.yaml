name: atk
version: 2.38.0
source:
  url: https://download.gnome.org/sources/atk/2.38/atk-2.38.0.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - glib-utils
  - gtk-doc
  - docbook-xml-dtd
  - pkgconfig
  - gettext
  - glib
  - gobject-introspection
  runtime:
  - glib
  - gobject-introspection
