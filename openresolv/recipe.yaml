name: openresolv
version: 3.17.4
source:
  url: https://github.com/NetworkConfiguration/openresolv/releases/download/v3.17.4/openresolv-3.17.4.tar.xz
build:
- ./configure --prefix=$PREFIX
- make -j$(nproc)
- make DESTDIR=$DESTDIR install
depends:
  build:
  - openpgp-keys-roymarples
  - systemd
  - selinux-resolvconf
  runtime:
  - systemd
  - selinux-resolvconf
