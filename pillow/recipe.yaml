name: pillow
version: 12.3.0
source:
  url: https://github.com/python-pillow/Pillow/archive/12.3.0.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - pybind11
  - setuptools-77
  - wheel
  - pkgconfig
  - defusedxml
  - packaging
  - imagemagick
  - graphicsmagick
  - libavif
  - libimagequant
  - libjpeg-turbo
  - openjpeg
  - lcms
  - tiff
  - freetype
  - harfbuzz
  - raqm
  - libwebp
  - libxcb
  - zlib
  runtime:
  - olefile
