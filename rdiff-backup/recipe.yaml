name: rdiff-backup
version: 2.2.6
source:
  url: https://github.com/rdiff-backup/rdiff-backup/releases/download/v2.2.6/rdiff-backup-2.2.6.tar.gz
build:
- pip install . --root=$DESTDIR --prefix=$PREFIX
depends:
  build:
  - pylibacl
  - pyxattr
  - pyyaml
  - librsync
  runtime:
  - pylibacl
  - pyxattr
  - pyyaml
  - librsync
