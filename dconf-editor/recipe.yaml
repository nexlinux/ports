name: dconf-editor
version: '49.0'
source:
  url: https://download.gnome.org/sources/dconf-editor/49/dconf-editor-49.0.tar.xz
build:
- meson setup build --prefix=$PREFIX
- meson compile -C build
- DESTDIR=$DESTDIR meson install -C build
depends:
  build:
  - libxml2
  - gettext
  - pkgconfig
  - dconf
  - glib
  - gtk+
  - libhandy
  runtime:
  - dconf
  - glib
  - gtk+
  - libhandy
