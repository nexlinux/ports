name: Daily Recipe Batch

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of recipes'
        default: '30'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ports repo
        uses: actions/checkout@v4
      
      - name: Checkout shift repo (for scripts)
        uses: actions/checkout@v4
        with:
          repository: nexlinux/shift
          path: shift
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install pyyaml
      
      - name: Clone Gentoo tree
        run: git clone --depth 1 https://github.com/gentoo/gentoo.git /tmp/gentoo-tree
      
      - name: Generate recipes
        run: |
          python3 scripts/ebuild2recipe-ci.py \
            --count ${{ github.event.inputs.count || '10' }} \
            --gentoo /tmp/gentoo-tree \
            --output .
      
      - name: Commit and push
        run: |
          git config user.name "shift-bot"
          git config user.email "bot@nex.shad1k1.online"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto: recipe batch $(date +%Y-%m-%d)"
            git push
            echo "[+] Pushed new recipes"
          else
            echo "[*] No new recipes"
          fi
